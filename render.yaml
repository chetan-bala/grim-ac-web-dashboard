services:
  - type: web
    name: grim-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: SUPABASE_URL
        value: https://igrsapeyxgmkjhadfrir.supabase.co
      - key: SUPABASE_SERVICE_KEY
        value: PASTE_YOUR_SERVICE_ROLE_KEY_HERE
      - key: JWT_SECRET
        value: grim-ac-secret-key-2026
      - key: EMAIL_USER
        value: your-email@gmail.com
      - key: EMAIL_PASS
        value: your-app-password
      - key: FRONTEND_URL
        value: https://grim-frontend.onrender.com

  - type: static_site
    name: grim-frontend
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://grim-backend.onrender.com
