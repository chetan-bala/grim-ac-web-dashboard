<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grim AC Web Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1219; color: #e1e5eb; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header { background: #1a1f2e; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { color: #7c3aed; }
    .btn { background: #7c3aed; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #6d28d9; }
    .card { background: #1a1f2e; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .recording-list { display: grid; gap: 15px; }
    .recording-item { background: #252b3d; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; }
    .form-group input { width: 100%; padding: 10px; background: #252b3d; border: 1px solid #3b4460; border-radius: 6px; color: white; }
    .login-container { max-width: 400px; margin: 100px auto; }
    .error { color: #ef4444; margin-top: 10px; }
    .success { color: #10b981; margin-top: 10px; }
    .nav { display: flex; gap: 15px; }
    .nav a { color: #94a3b8; text-decoration: none; }
    .nav a:hover { color: white; }
    .replay-container { height: 400px; background: #252b3d; border-radius: 6px; position: relative; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
